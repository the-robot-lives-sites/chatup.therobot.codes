# 〚📁:91d25ef8-f3d7-530f-b6b1-b8e9824266e3〛 helm/chatup/values.yaml :: chart values: domain, image tag (CI-bumped), TLS Infisical wiring.
static-site:
  nameOverride: chatup
  fullnameOverride: chatup
  domain: chatup.therobot.codes
  extraHosts: []
  image: ops.noizu.com/chatup.therobot.codes/web:sha-4d369a8
  port: 80
  imagePullSecrets:
    - name: ops-registry-secret
  tls:
    secretName: chatup-therobot-codes-tls
    infisical:
      enabled: true
      secretsPath: "/apps/tls/chatuptherobotcodes"
      crtKey: CHATUP_TLS_CRT
      keyKey: CHATUP_TLS_KEY
